name: Big Word
summary: Turn your Android screen into a sign with large text, colors and animations.
description: |
  Type a message and tap BIG to show it full screen. Use Big Word when you
  want your message to be seen across a room or in a noisy place.

  - Fit the whole message on screen, scroll it across, or show one word at a time.
  - Choose from ten fonts and twelve color palettes.
  - Adjust the animation speed or turn on Blink.
  - Save messages as favorites for later.

  Works offline. Messages, favorites and settings stay on your device.
  Requires Android 7.0 or newer. Open source under the MIT License.
license: MIT
